<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jamshidbek Yusupov — Data Scientist</title>
  <meta name="description" content="Portfolio of Jamshidbek Yusupov, data scientist — machine learning, NLP and language-model projects.">
  <meta name="theme-color" content="#07080a">
  <meta property="og:title" content="Jamshidbek Yusupov — Data Scientist">
  <meta property="og:description" content="Machine learning, NLP and language-model projects.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080a'/%3E%3Ctext x='32' y='41' font-family='monospace' font-size='24' font-weight='700' text-anchor='middle' fill='%237cf5d1'%3EJY%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script>
    // Apply the saved/default theme before first paint so the page never flashes the wrong colours.
    (function () {
      var themes = { dark: 1, white: 1, indigo: 1 }, t = null;
      try { t = localStorage.getItem("portfolio-theme"); } catch (e) {}
      if (!themes[t]) t = (window.SITE_CONFIG && window.SITE_CONFIG.defaultTheme) || "dark";
      document.documentElement.setAttribute("data-theme", themes[t] ? t : "dark");
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top"><span class="brand-mark">JY</span><span id="brand-name">Jamshidbek Yusupov</span></a>
      <nav aria-label="Main">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="theme-switch" id="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" class="theme-btn" data-theme-value="dark" aria-pressed="false" title="Dark"><span class="visually-hidden">Dark theme</span></button>
        <button type="button" class="theme-btn" data-theme-value="white" aria-pressed="false" title="White"><span class="visually-hidden">White theme</span></button>
        <button type="button" class="theme-btn" data-theme-value="indigo" aria-pressed="false" title="Indigo"><span class="visually-hidden">Indigo theme</span></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" id="top">
      <p class="status"><span class="pulse" aria-hidden="true"></span><span id="hero-meta"></span></p>
      <div class="name-row">
        <h1 id="hero-name">Jamshidbek Yusupov</h1>
        <div class="avatar-frame" id="avatar-frame" hidden>
          <img id="hero-avatar" class="avatar" alt="" width="220" height="220">
        </div>
      </div>
      <p class="role"><span class="prompt" aria-hidden="true">&gt;</span> <span id="hero-role">Data Scientist</span><span class="caret" aria-hidden="true"></span></p>
      <p class="tagline" id="hero-tagline"></p>
      <p class="hero-actions" id="hero-actions"></p>
      <div class="hero-foot">
        <dl class="stats" id="stats"></dl>
      </div>
      <p class="last-active" id="last-active"></p>
    </section>

    <section class="wrap section" id="about">
      <header class="section-head">
        <h2>About</h2>
      </header>
      <div class="about-grid">
        <div id="about-text" class="prose"></div>
        <div id="skills" class="skills"></div>
      </div>
    </section>

    <section class="wrap section" id="projects">
      <header class="section-head">
        <h2>Projects</h2>
        <p class="section-sub">Synced with GitHub</p>
      </header>
      <div id="project-list" class="featured" aria-live="polite">
        <p class="loading">Fetching repositories…</p>
      </div>
    </section>

    <section class="wrap section" id="contact">
      <header class="section-head">
        <h2>Contact</h2>
      </header>
      <ul class="contact" id="contact-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; <span id="year"></span> <span id="footer-name">Jamshidbek Yusupov</span></p>
      <p id="sync-note"></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
